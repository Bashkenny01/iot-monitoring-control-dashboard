<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>IoT Monitoring & Control Dashboard</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="header">
    <h1>IoT Monitoring & Control Dashboard</h1>
    <p class="subtitle">Simulated devices — real-time monitoring & control</p>
  </header>

  <main class="container">
    <section class="left">
      <h2>Devices</h2>
      <div id="devices" class="grid"></div>
    </section>

    <aside class="right">
      <div class="panel">
        <h3>Alerts</h3>
        <ul id="alerts" class="alerts"></ul>
      </div>

      <div class="panel">
        <h3>Automation</h3>
        <form id="ruleForm">
          <label>Watch Device
            <select id="watchDevice"></select>
          </label>
          <label>Watch Metric
            <select id="watchMetric">
              <option value="temperature">temperature</option>
              <option value="humidity">humidity</option>
            </select>
          </label>
          <label>Operator
            <select id="operator">
              <option value=">">&gt;</option>
              <option value="<">&lt;</option>
              <option value=">=">&gt;=</option>
              <option value="<=">&lt;=</option>
              <option value="==">==</option>
            </select>
          </label>
          <label>Threshold
            <input id="threshold" type="number" step="0.1" value="30" />
          </label>
          <label>Target Device
            <select id="targetDevice"></select>
          </label>
          <label>Action
            <select id="action">
              <option value="on">Turn ON</option>
              <option value="off">Turn OFF</option>
            </select>
          </label>
          <button type="submit">Add Rule</button>
        </form>
        <ul id="rulesList" class="rules"></ul>
      </div>
    </aside>
  </main>

  <footer class="footer">
    <small>Simulated devices — no physical hardware required.</small>
  </footer>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/app.js"></script>
</body>
</html>
